[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor-mystery"
version = "0.1.0"
description = "A terminal detective game used as a test bed for a multi-agent architecture."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harbor = "harbor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harbor = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
